name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  c:
    name: C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test-c

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l go)"
      - run: make test-go

  ruby:
    name: Ruby
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: make test-ruby

  prolog:
    name: Prolog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - run: make test-prolog

  lisp:
    name: Common Lisp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      - run: make test-lisp

  advent-of-code:
    name: Advent of Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: advent-of-code/2024/go.mod
      - name: Install SBCL (2025 is in Common Lisp)
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Install the Clojure CLI (2019-2021 are in Clojure)
        run: |
          curl -fsSL -o linux-install.sh https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh && sudo ./linux-install.sh && rm linux-install.sh
      - run: make test-aoc
